[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-copilot"
version = "0.1.0"
description = "AI Customer Support Copilot: ticket drafting on top of the rag_core RAG service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rag-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The operator web UI; without this a non-editable install (Docker) ships no static files.
support_copilot = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["venv"]
